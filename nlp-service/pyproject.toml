[project]
name = "resume-parser"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.1.0",
    "python-docx==1.1.2",
    "pdfplumber==0.11.5",
    "langdetect==1.0.9",
    "nltk==3.9.1",
    "scikit-learn==1.5.2",
    "spacy==3.8.5",
]

[tool.vercel]
entrypoint = "app.web:app"

[tool.vercel.scripts]
build = "python build.py"
